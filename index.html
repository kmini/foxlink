  <style>
:root {
  color-scheme: light;
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: #14243e;
  background: #eef4fb;
}

* { box-sizing: border-box; }

body {
  display: grid;
  min-height: 100vh;
  min-height: 100svh;
  margin: 0;
  padding: clamp(2.25rem, 9vw, 6rem) 1.25rem;
  background: radial-gradient(ellipse at 50% 4%, #dbeaff 0, #eef4fb 60%, #f7f9fc 100%);
}

main {
  align-self: center;
  justify-self: center;
  width: min(100%, 47rem);
}

header { margin: 0 auto clamp(1.75rem, 5vw, 3rem); text-align: center; }

header img {
  display: block;
  margin: 0 auto 1.375rem;
  border-radius: 1.125rem;
  box-shadow: 0 .5rem 1.5rem #235b9c38;
}

h1 {
  margin: 0;
  font-size: clamp(1.9rem, 6vw, 3rem);
  letter-spacing: -.035em;
  line-height: 1.15;
}

h1 span { letter-spacing: -.07em; }

p {
  margin: .55rem 0 0;
  color: #4f6179;
  font-size: 1rem;
  line-height: 1.55;
}

header p { margin-top: .8rem; }

.downloads {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1rem;
}

section {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 0 .5rem;
  padding: clamp(1.2rem, 4vw, 1.75rem);
  background: #fff;
  border: 1px solid #d8e3f2;
  border-radius: 1.25rem;
  box-shadow: 0 .65rem 2rem #24466e0c;
}

h2 {
  grid-column: 1;
  margin: 0;
  font-size: clamp(1.45rem, 5vw, 1.9rem);
  line-height: 1.2;
  letter-spacing: -.04em;
}

section p { grid-column: 1; }

.version {
  grid-column: 2;
  grid-row: 1;
  align-self: center;
  padding: .25rem .5rem;
  border-radius: .35rem;
  background: #eef4fb;
  color: #365476;
  font-size: .875rem;
  font-variant-numeric: tabular-nums;
}

<script>
const repository = "kmini/foxlink-desktop-updates";
const manifestRoot = "https://kmini.github.io/foxlink-desktop-updates/";
const downloadRoot = `https://github.com/${repository}/releases/download/`;

async function syncDownload(card) {
  const channel = card.dataset.channel;
  const response = await fetch(`${manifestRoot}releases.${channel}.json`, {
    cache: "no-cache",
    credentials: "omit",
    signal: AbortSignal.timeout(5000),
  });
  if (!response.ok) return;

  const manifest = await response.json();
  if (!Array.isArray(manifest.Assets)) return;
  const assets = manifest.Assets.filter((asset) =>
    asset?.Type === "Full"
    && asset.PackageId === "FoxLinkDesktop"
    && typeof asset.Version === "string"
    && /^\d+\.\d+\.\d+$/.test(asset.Version)
    && asset.FileName === `FoxLinkDesktop-${asset.Version}-${channel}-full.nupkg`
  );
  if (!assets.length) return;

  const displayed = card.querySelector(".version");
  const [latest] = assets.sort((a, b) =>
    b.Version.localeCompare(a.Version, "en", { numeric: true })
  );
  if (latest.Version.localeCompare(displayed.textContent, "en", { numeric: true }) <= 0) return;

  card.querySelector("a").href = `${downloadRoot}v${latest.Version}/${latest.FileName}`;
  displayed.textContent = latest.Version;
}

for (const card of document.querySelectorAll("[data-channel]")) {
  // Keep the verified fallback links available if the manifest is unreachable.
  syncDownload(card).catch(() => {});
}
</script>
